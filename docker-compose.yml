version: '3'
services:
  redis_lma:
    image: redis:latest
    container_name: redis_lma
    ports:
      - ${REDIS_PORT}:6379
    networks:
      - lma_net

  mysql_lma:
    image: mysql:8.0
    container_name: mysql_lma
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql_lma:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - lma_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_lma:
    name: mysql_lma

networks:
  lma_net:
    name: lma_net